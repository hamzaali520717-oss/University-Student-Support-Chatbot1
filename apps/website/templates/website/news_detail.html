{% extends "base.html" %}

{% block title %}{{ post.title }} — Smart University Portal{% endblock %}

{% block content %}
<article class="mx-auto max-w-3xl px-4 py-16 sm:px-6 lg:px-8">
    <p class="kicker">Campus</p>
    <h1 class="mt-3 font-display text-4xl font-semibold text-brand-700">{{ post.title }}</h1>
    <p class="mt-2 text-sm uppercase tracking-widest text-brand-600">{{ post.publish_at|date:"F j, Y" }}</p>
    {% if post.image %}
    <img
        src="{{ post.image.url }}"
        alt=""
        loading="eager"
        class="mt-8 h-80 w-full rounded-sm object-cover"
    >
    {% endif %}
    <div class="mt-8 text-lg leading-relaxed text-gray-800">
        <p>{{ post.body|linebreaksbr }}</p>
    </div>
    <a href="{% url 'website:news-list' %}" class="mt-10 inline-block nav-link">&larr; Back to News</a>
</article>
{% endblock %}
